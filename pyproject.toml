[project]
name = "docs-web-search-pgvector"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_system"]
